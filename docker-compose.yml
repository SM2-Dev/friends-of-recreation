services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: friends_of_recreation
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d friends_of_recreation']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
